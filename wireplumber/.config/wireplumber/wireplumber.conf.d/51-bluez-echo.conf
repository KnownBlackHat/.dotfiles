monitor.bluez.properties = {
    bluez5.roles = [a2dp_source] # PC only sends audio not rcv
}

monitor.bluez.rules = [
    {
    matches = [{ node.name = "~bluez_output.*" }]
    actions = {
        update-props = {
            # never pause bt out when audio stops
            session.suspend-timeout-seconds = 0
        }
    }
    }
]
